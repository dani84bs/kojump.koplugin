name: Manual Plugin Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: get_version
        run: |
          VERSION=$(sed -n 's/.*version = "\(.*\)".*/\1/p' _meta.lua)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Assemble plugin directory
        run: |
          mkdir kojump.koplugin
          # Use rsync style or just copy all and remove. 
          # Since it is a fresh checkout, we copy everything.
          cp -r . kojump.koplugin/ || true
          
          # Remove excluded folders
          rm -rf kojump.koplugin/.git
          rm -rf kojump.koplugin/.github
          rm -rf kojump.koplugin/spec
          
          # Remove excluded files
          rm -f kojump.koplugin/run_tests.sh
          
          # Remove the staging directory itself from within itself if cp copied it
          rm -rf kojump.koplugin/kojump.koplugin

      - name: Zip plugin
        run: |
          zip -r kojump.koplugin.zip kojump.koplugin

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          draft: true
          files: kojump.koplugin.zip
